name: WarehouseWest — Validate and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: WarehouseWest website checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check website
        run: python3 scripts/check-site.py
      - name: Stage public files
        run: python3 scripts/build-site.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: WarehouseWest live website
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show WarehouseWest website link
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '## WarehouseWest — Live Website\n\n[Open WarehouseWest](%s)\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
